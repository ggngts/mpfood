server {
    listen 80;
    server_name food.mpnw.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name food.mpnw.online;

    ssl_certificate /etc/letsencrypt/live/food.mpnw.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food.mpnw.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 1. ФРОНТЕНД: Раздача твоих HTML, CSS, JS
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # try_files нужен, чтобы если юзер обновит страницу внутри приложения, 
        # Nginx не выдал 404, а корректно передал управление роутеру фронтенда
        try_files $uri $uri/ /index.html; 
    }

    # 2. БЭКЕНД: Проксирование запросов к API
    location /api/ {
        # ВАЖНО: Слэш на конце "http://mpfood-api:8000/" обязателен!
        # Благодаря ему Nginx будет ОТРЕЗАТЬ префикс "/api/" перед тем, как передать запрос в FastAPI.
        # Пример: запрос https://food.mpnw.online/api/orders уйдет в FastAPI как просто /orders.
        proxy_pass http://mpfood-api:8000/; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
