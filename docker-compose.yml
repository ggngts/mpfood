version: '3.8'

services:
  # 1. База данных MySQL
  mpfood-db:
    image: mysql:8.0
    container_name: mpfood-db
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=mpfood
      - MYSQL_USER=mpfood
      - MYSQL_PASSWORD=fs)Pk4h]ek]DuBJN
      - MYSQL_ROOT_PASSWORD=NIDFuefiwwnini237469mcdAEZOV
    volumes:
      - mysql_data:/var/lib/mysql
#    ports:
 #     - "3306:3306"

  # 2. Кэш Redis (для aiogram / хранения сессий)
  mpfood-redis:
    image: redis:7-alpine
    container_name: mpfood-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Бэкенд API (FastAPI)
  mpfood-api:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: mpfood-api
    restart: always
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - DB_HOST=mpfood-db
      - DATABASE_URL=mysql+pymysql://mpfood:fs)Pk4h]ek]DuBJN@host.docker.internal:3306/mpfood
      - REDIS_HOST=mpfood-redis
    depends_on:
      - mpfood-db
      - mpfood-redis

  # 4. Фоновый Telegram-бот (aiogram)
  mpfood-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpfood-bot
    restart: always
    command: python bot.py
    env_file:
      - .env
    environment:
      - DB_HOST=mpfood-db
      - REDIS_HOST=mpfood-redis
    depends_on:
      - mpfood-db
      - mpfood-redis

  # 5. Веб-сервер Nginx (Фронтенд + Прокси к API)
# 5. Веб-сервер Nginx (Фронтенд + Прокси к API

  nginx:
    image: nginx:alpine
    container_name: mpfood-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Монтируем наш конфиг в правильную папку, не затирая корень /etc/nginx
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      # Монтируем папку Certbot с хоста внутрь контейнера в режиме "только чтение" (ro)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - mpfood-api

volumes:
  mysql_data:
